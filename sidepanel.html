<!doctype html>
<html>
  <head>
    <title>Yan Panel</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="status-bar" style="display: none"></div>
    <div id="youtube-mode" style="display: none">
      <div id="transcript-box">
        <div id="transcript-header">
          <span id="transcript-title"></span>
          <button id="copy-btn">📋 Kopyala</button>
          <button id="open-chatgpt-btn">💬 ChatGPT'de Aç</button>
        </div>
        <pre id="transcript-text"></pre>
      </div>
    </div>
    <iframe
      id="chatgpt-frame"
      src="https://chatgpt.com/"
      frameborder="0"
    ></iframe>
    <script src="sidepanel.js"></script>
  </body>
</html>
